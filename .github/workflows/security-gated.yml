# ─────────────────────────────────────────────────────────────────────────────
# Security-Gated CI Pipeline
#
# Extends the baseline build with static analysis, secret scanning, and
# dependency vulnerability checks. Every security tool acts as a gate —
# any finding above the configured threshold fails the pipeline.
#
# Tools:  CodeQL · Semgrep · SpotBugs + FindSecBugs · Gitleaks · OWASP DC
# ─────────────────────────────────────────────────────────────────────────────
name: Security-Gated Pipeline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

env:
  JAVA_VERSION: "21"
  MAVEN_OPTS: "-Xmx1024m"
  SPOTBUGS_VERSION: "4.9.3"
  FINDSECBUGS_VERSION: "1.12.0"
  GITLEAKS_VERSION: "8.18.4"

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Compile & Lint ─────────────────────────────────────────────────────
  compile:
    name: Compile & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Compile with lint warnings
        run: mvn compile -B

  # ── 2. Unit Tests ─────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run tests
        run: mvn test -B

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-test-reports
          path: target/surefire-reports/
          retention-days: 30

  # ── 3. CodeQL (SAST) ─────────────────────────────────────────────────────
  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          config-file: .github/codeql-config.yml

      - name: Build for CodeQL
        run: mvn compile -B -DskipTests

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
          output: codeql-results

      - name: Upload CodeQL SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: codeql-results/
          retention-days: 30

      # Gate: fail if any security finding exists in the SARIF output.
      - name: Fail on CodeQL security findings
        if: always()
        run: |
          if ! ls codeql-results/*.sarif 1>/dev/null 2>&1; then
            echo "::warning::No SARIF files found — skipping gate (possible infra issue)"
            exit 0
          fi

          FINDINGS=$(python3 -c "
          import json, glob
          count = 0
          for f in glob.glob('codeql-results/*.sarif'):
              with open(f) as fh:
                  sarif = json.load(fh)
                  for run in sarif.get('runs', []):
                      count += len(run.get('results', []))
          print(count)
          ")

          echo "CodeQL findings: $FINDINGS"
          if [ "$FINDINGS" -gt 0 ]; then
            echo "::error::CodeQL found $FINDINGS security finding(s) — gate failed"
            exit 1
          fi

  # ── 4. Semgrep (SAST) ────────────────────────────────────────────────────
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    needs: compile
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4

      # Primary scan — JSON output, ERROR severity only, --error flag for gating.
      - name: Run Semgrep (gate)
        id: semgrep_gate
        continue-on-error: true
        run: |
          semgrep scan \
            --config "p/java" \
            --config "p/findsecbugs" \
            --config "p/owasp-top-ten" \
            --config "p/cwe-top-25" \
            --severity ERROR \
            --error \
            --json \
            --output semgrep-results.json \
            src/

      # Secondary scan — SARIF for GitHub Security tab integration.
      - name: Run Semgrep (SARIF report)
        if: always()
        continue-on-error: true
        run: |
          semgrep scan \
            --config "p/java" \
            --config "p/findsecbugs" \
            --config "p/owasp-top-ten" \
            --config "p/cwe-top-25" \
            --sarif \
            --output semgrep-results.sarif \
            src/

      - name: Upload Semgrep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: |
            semgrep-results.sarif
            semgrep-results.json
          retention-days: 30

      - name: Fail on Semgrep findings
        if: steps.semgrep_gate.outcome == 'failure'
        run: |
          echo "::error::Semgrep found ERROR-severity findings — gate failed"
          exit 1

  # ── 5. SpotBugs + FindSecBugs ────────────────────────────────────────────
  spotbugs:
    name: SpotBugs + FindSecBugs
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build classes and export classpath
        run: |
          mvn -B -DskipTests clean compile dependency:build-classpath \
            -Dmdep.outputFile=target/classpath.txt

      - name: Install SpotBugs and FindSecBugs
        run: |
          mkdir -p tools target/spotbugs

          curl -fsSL -o tools/spotbugs.tgz \
            "https://github.com/spotbugs/spotbugs/releases/download/${SPOTBUGS_VERSION}/spotbugs-${SPOTBUGS_VERSION}.tgz"
          tar -xzf tools/spotbugs.tgz -C tools

          curl -fsSL -o tools/findsecbugs-plugin.jar \
            "https://repo1.maven.org/maven2/com/h3xstream/findsecbugs/findsecbugs-plugin/${FINDSECBUGS_VERSION}/findsecbugs-plugin-${FINDSECBUGS_VERSION}.jar"

      - name: Run SpotBugs with FindSecBugs
        id: spotbugs_scan
        continue-on-error: true
        run: |
          set -euo pipefail
          AUX_CP="$(cat target/classpath.txt)"

          java -jar "tools/spotbugs-${SPOTBUGS_VERSION}/lib/spotbugs.jar" \
            -textui \
            -effort:max \
            -low \
            -exclude .github/spotbugs-exclude.xml \
            -pluginList "tools/findsecbugs-plugin.jar" \
            -auxclasspath "$AUX_CP" \
            -xml:withMessages \
            -output "target/spotbugs/spotbugs.xml" \
            target/classes

      - name: Upload SpotBugs results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-results
          path: target/spotbugs/
          retention-days: 30

      # Gate: parse the XML report and fail if any BugInstance exists.
      - name: Fail on SpotBugs findings
        if: always()
        run: |
          if [ ! -f target/spotbugs/spotbugs.xml ]; then
            echo "::warning::SpotBugs XML report missing — skipping gate (possible infra issue)"
            exit 0
          fi

          FINDINGS=$(python3 -c "
          import xml.etree.ElementTree as ET
          root = ET.parse('target/spotbugs/spotbugs.xml').getroot()
          print(len(root.findall('.//BugInstance')))
          ")

          echo "SpotBugs/FindSecBugs findings: $FINDINGS"
          if [ "$FINDINGS" -gt 0 ]; then
            echo "::error::SpotBugs/FindSecBugs found $FINDINGS finding(s) — gate failed"
            exit 1
          fi

  # ── 6. Gitleaks (Secret Scanning) ────────────────────────────────────────
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history required for secret scanning

      - name: Install Gitleaks
        run: |
          wget -qO- \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks
        id: gitleaks_scan
        continue-on-error: true
        run: |
          set -o pipefail
          gitleaks detect \
            --source . \
            --report-format sarif \
            --report-path gitleaks-results.sarif \
            --verbose 2>&1 | tee gitleaks-output.txt

      - name: Upload Gitleaks results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: |
            gitleaks-results.sarif
            gitleaks-output.txt
          retention-days: 30

      - name: Fail on leaked secrets
        if: steps.gitleaks_scan.outcome == 'failure'
        run: |
          echo "::error::Gitleaks found leaked secrets — gate failed"
          exit 1

  # ── 7. OWASP Dependency-Check (SCA) ──────────────────────────────────────
  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # Gate threshold: CVSS >= 7 (High / Critical).
      - name: Run OWASP Dependency-Check
        id: depcheck
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn dependency-check:check -B \
            -DnvdApiKey="$NVD_API_KEY" \
            -Dformats=HTML,JSON,SARIF \
            -DprettyPrint=true \
            -DoutputDirectory=target/dependency-check \
            -DfailBuildOnCVSS=7

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check/
          retention-days: 30

      - name: Fail on vulnerable dependencies
        if: steps.depcheck.outcome == 'failure'
        run: |
          if [ -f target/dependency-check/dependency-check-report.json ]; then
            echo "::error::Dependency-Check found vulnerabilities with CVSS >= 7 — gate failed"
            exit 1
          else
            echo "::warning::Dependency-Check failed (likely NVD download issue) — skipping gate"
            exit 0
          fi

  # ── 8. Security Gate (aggregate decision) ────────────────────────────────
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [test, codeql, semgrep, spotbugs, gitleaks, dependency-check]
    if: always()
    steps:
      - name: Evaluate security gate
        run: |
          echo "## Security Gate Results"                                >> "$GITHUB_STEP_SUMMARY"
          echo "| Tool               | Result   |"                      >> "$GITHUB_STEP_SUMMARY"
          echo "|--------------------|----------|"                      >> "$GITHUB_STEP_SUMMARY"
          echo "| Unit Tests         | ${{ needs.test.result }} |"      >> "$GITHUB_STEP_SUMMARY"
          echo "| CodeQL             | ${{ needs.codeql.result }} |"    >> "$GITHUB_STEP_SUMMARY"
          echo "| Semgrep            | ${{ needs.semgrep.result }} |"   >> "$GITHUB_STEP_SUMMARY"
          echo "| SpotBugs           | ${{ needs.spotbugs.result }} |"  >> "$GITHUB_STEP_SUMMARY"
          echo "| Gitleaks           | ${{ needs.gitleaks.result }} |"  >> "$GITHUB_STEP_SUMMARY"
          echo "| Dependency-Check   | ${{ needs.dependency-check.result }} |" >> "$GITHUB_STEP_SUMMARY"

          FAILED=false
          for result in \
            "${{ needs.test.result }}" \
            "${{ needs.codeql.result }}" \
            "${{ needs.semgrep.result }}" \
            "${{ needs.spotbugs.result }}" \
            "${{ needs.gitleaks.result }}" \
            "${{ needs.dependency-check.result }}"; do
            [ "$result" = "failure" ] && FAILED=true
          done

          if [ "$FAILED" = true ]; then
            echo "::error::SECURITY GATE FAILED — one or more checks did not pass"
            exit 1
          fi
          echo "✅ Security gate passed — all checks succeeded"

  # ── 9. Record Pipeline Metrics ───────────────────────────────────────────
  record-metrics:
    name: Record Pipeline Metrics
    runs-on: ubuntu-latest
    needs: [compile, test, codeql, semgrep, spotbugs, gitleaks, dependency-check, security-gate]
    if: always()
    steps:
      - name: Collect pipeline metadata
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Security-Gated Pipeline Metrics
          | Metric           | Value |
          |------------------|-------|
          | Pipeline         | Security-Gated |
          | PR Number        | ${{ github.event.pull_request.number }} |
          | Run ID           | ${{ github.run_id }} |
          | Run Attempt      | ${{ github.run_attempt }} |
          | Triggered at     | $(date -u +%Y-%m-%dT%H:%M:%SZ) |
          | Compile          | ${{ needs.compile.result }} |
          | Tests            | ${{ needs.test.result }} |
          | CodeQL           | ${{ needs.codeql.result }} |
          | Semgrep          | ${{ needs.semgrep.result }} |
          | SpotBugs         | ${{ needs.spotbugs.result }} |
          | Gitleaks         | ${{ needs.gitleaks.result }} |
          | Dep-Check        | ${{ needs.dependency-check.result }} |
          | Security Gate    | ${{ needs.security-gate.result }} |
          EOF