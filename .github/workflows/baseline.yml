# ─────────────────────────────────────────────────────────────────────────────
# Baseline CI Pipeline
#
# Compile, test, and gate. No security tooling — see the Security-Gated
# pipeline for SAST, SCA, and secret scanning.
# ─────────────────────────────────────────────────────────────────────────────
name: Baseline Pipeline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  MAVEN_OPTS: "-Xmx1024m"

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Compile & Lint ─────────────────────────────────────────────────────
  compile:
    name: Compile & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Compile
        run: mvn -B clean compile

  # ── 2. Unit Tests ─────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run tests
        run: mvn -B test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-test-reports
          path: target/surefire-reports/
          retention-days: 30

  # ── 3. Baseline Gate ──────────────────────────────────────────────────────
  baseline-gate:
    name: Baseline Gate
    runs-on: ubuntu-latest
    needs: [compile, test]
    if: always()
    steps:
      - name: Evaluate baseline gate
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Baseline Gate Results
          | Check   | Result |
          |---------|--------|
          | Compile | ${{ needs.compile.result }} |
          | Tests   | ${{ needs.test.result }} |
          EOF

          FAILED=false
          for result in "${{ needs.compile.result }}" "${{ needs.test.result }}"; do
            [ "$result" = "failure" ] && FAILED=true
          done

          if [ "$FAILED" = true ]; then
            echo "::error::Baseline gate failed — one or more checks did not pass"
            exit 1
          fi
          echo "✅ Baseline gate passed"

  # ── 4. Record Pipeline Metrics ───────────────────────────────────────────
  record-metrics:
    name: Record Pipeline Metrics
    runs-on: ubuntu-latest
    needs: [compile, test, baseline-gate]
    if: always()
    steps:
      - name: Collect pipeline metadata
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Baseline Pipeline Metrics
          | Metric        | Value |
          |---------------|-------|
          | Pipeline      | Baseline |
          | PR Number     | ${{ github.event.pull_request.number }} |
          | Run ID        | ${{ github.run_id }} |
          | Run Attempt   | ${{ github.run_attempt }} |
          | Triggered at  | $(date -u +%Y-%m-%dT%H:%M:%SZ) |
          | Compile       | ${{ needs.compile.result }} |
          | Tests         | ${{ needs.test.result }} |
          | Baseline Gate | ${{ needs.baseline-gate.result }} |
          EOF